name: FinSight CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify API
        working-directory: backend
        run: bash ./mvnw -B -ntp verify

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend/web
        run: npm ci
      - name: Lint and build
        working-directory: frontend/web
        run: npm run lint && npm run build
      - name: Report calendar boundaries
        run: node --experimental-strip-types --test scripts/check-report-date.mjs

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend/mobile
        run: npm ci
      - name: Typecheck, lint and Expo Doctor
        working-directory: frontend/mobile
        run: npx tsc --noEmit && npm run lint && npx expo-doctor
      - name: Recovery link parsing
        run: node --experimental-strip-types --test scripts/check-recovery-link.mjs
